<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0d">
<meta name="description" content="RUVA Detailing online araç yıkama randevusu. Paket ve saat seçiminizi kolayca yapın.">
<title>RUVA Detailing | Online Randevu</title>
<meta name="ruva-build" content="v5.1-20261014">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#c99d60;--light:#e6c48f;--bg:#090b0d;--ivory:#f1ede6}
*{box-sizing:border-box}html,body{padding:0;margin:0;background:var(--bg);color:var(--ivory);font-family:'Montserrat',Arial,sans-serif}a{color:inherit;text-decoration:none}
.header{position:sticky;top:0;z-index:30;height:59px;display:flex;align-items:center;background:rgba(9,11,13,.97);border-bottom:1px solid rgba(206,157,91,.2);backdrop-filter:blur(12px)}
.wrap{width:min(980px,calc(100% - 30px));margin:0 auto}.header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;height:100%}
.logo{width:min(161px,49vw);height:auto;display:block}.back{font:700 10px 'Oxanium',Arial,sans-serif;letter-spacing:.09em;color:#e7c18b;text-transform:uppercase;white-space:nowrap;border:1px solid rgba(218,168,91,.35);padding:9px 11px}
.intro{padding:28px 0 4px;display:flex;gap:22px;align-items:flex-end;justify-content:space-between}.eyebrow{color:#d5a86d;font:700 12px 'Oxanium',Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}.intro h1{font:700 clamp(24px,5vw,42px)/1.08 'Oxanium',Arial,sans-serif;letter-spacing:.035em;margin:9px 0 0;text-transform:uppercase}
.intro p{max-width:390px;font-size:12px;line-height:1.8;color:#b7b0a7;margin:0}
#bookingFrame{width:100%;display:block;min-height:850px;height:1300px;border:0;background:var(--bg)}
.foot{text-align:center;font:600 11px 'Oxanium',Arial,sans-serif;letter-spacing:.20em;color:#9e815f;padding:0 10px 15px}
@media(max-width:640px){.header{height:58px}.logo{width:min(155px,49vw)}.back{padding:8px 9px;font-size:10px}.intro{display:block;padding:22px 0 3px}.intro p{margin-top:8px;font-size:12px}.intro h1{font-size:27px}.wrap{width:calc(100% - 26px)}}
</style></head><body>
<header class="header"><div class="wrap"><a href="../" aria-label="Ruva ana sayfa"><img class="logo" src="../ruva_logo_gold.png" alt="RUVA Detailing"></a><a class="back" href="../">← ANA SAYFA</a></div></header>
<main><iframe id="bookingFrame" title="RUVA Detailing Randevu" src="https://mustafakaraapca-collab.github.io/oto-yikama-ciro-takip/randevu-v5-kompakt.html"></iframe></main>
<footer class="foot">RUVA / İLK GÜNKÜ HEYECAN</footer>
<script>
window.addEventListener('message',function(event){
  if(event.origin!=='https://mustafakaraapca-collab.github.io')return;
  if(!event.data||event.data.type!=='ruva:booking-height')return;
  const value=Number(event.data.height);
  if(!Number.isFinite(value)||value<200||value>15000)return;
  document.getElementById('bookingFrame').style.height=Math.ceil(value+12)+'px';
});
</script>
</body></html>
